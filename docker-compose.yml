services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # ── AWS credentials ──────────────────────────────────────────
      # Paste your IAM user credentials here, or export them in your
      # shell and let Docker Compose pick them up via ${VAR} syntax.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      # Live-reload: source changes are reflected instantly
      - .:/app
