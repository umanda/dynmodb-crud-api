name: CD Deploy ECS

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
        type: string
      deploy_infra:
        description: Deploy CDK ECS infra before app rollout
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ecr_repository:
        description: ECR repository name
        required: true
        default: dynmodb-crud-api
        type: string
      ecs_cluster:
        description: ECS cluster name
        required: true
        default: dynmodb-crud-api-cluster
        type: string
      ecs_service:
        description: ECS service name
        required: true
        default: dynmodb-crud-api-service
        type: string
      desired_count:
        description: ECS desired task count after deployment
        required: true
        default: "1"
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.aws_region }}

jobs:
  deploy-ecs:
    name: Build, Push, Deploy to ECS
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK dependencies
        if: ${{ github.event.inputs.deploy_infra == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cdk.txt
          npm install -g aws-cdk

      - name: Deploy ECS infrastructure (CDK)
        if: ${{ github.event.inputs.deploy_infra == 'true' }}
        run: |
          cdk deploy \
            dynmodb-crud-api-network \
            dynmodb-crud-api-ecr \
            dynmodb-crud-api-ecs \
            --require-approval never \
            -c deploy.mode=ecs \
            -c region=${AWS_REGION}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ github.event.inputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG} -f Dockerfile.prod .
          docker tag ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:latest
          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${REPOSITORY}:latest

      - name: Deploy latest image to ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ github.event.inputs.ecs_cluster }} \
            --service ${{ github.event.inputs.ecs_service }} \
            --desired-count ${{ github.event.inputs.desired_count }} \
            --force-new-deployment \
            --region ${AWS_REGION}

          aws ecs wait services-stable \
            --cluster ${{ github.event.inputs.ecs_cluster }} \
            --services ${{ github.event.inputs.ecs_service }} \
            --region ${AWS_REGION}
