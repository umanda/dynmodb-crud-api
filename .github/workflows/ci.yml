name: CI

on:
  pull_request:
  push:
    branches:
      - main-x

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile source
        run: |
          python -m compileall src infra

      - name: Run tests
        run: |
          set +e
          pytest -q
          code=$?
          # pytest exits 5 when no tests are collected; treat as non-fatal for now.
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
            exit 0
          fi
          exit "$code"

  ansible-syntax:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.20,<2.24" community.docker

      - name: Validate playbook syntax
        working-directory: ansible
        run: |
          ansible-playbook -i inventory-sample.ini playbook.yml --syntax-check
